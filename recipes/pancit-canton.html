    <h1>Pancit Canton</h1>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/Instant_noodles.jpg/800px-Instant_noodles.jpg" alt="Pancit Canton" width="400">
    <h2>Description</h2>
    <p>Pancit Canton is instant egg noodles with seasoning.</p>
    <h2>Ingredients</h2>
    <ul>
        <li>1 pack pancit canton noodles</li>
    </ul>
    <h2>Steps</h2>
    <ol>
        <li>Boil water in a pot.</li>
        <li>Add noodles and cook for 3 minutes.</li>
        <li>Drain water.</li>
        <li>Mix in included seasoning.</li>
        <li>Serve.</li>
    </ol>
